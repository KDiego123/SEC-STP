camera:
  type: webcam        # webcam | rtsp
  source: 0           # 0 para webcam, URL RTSP si aplica
  reconnect_delay: 5  # segundos

processing:
  resize: 0.55
  target_fps: 10

display:
  show: true
  window_name: "Vigilancia STP - Personas y vehiculos"

model:
  #yolo_model: yolov8s.pt
  yolo_model: yolov8n.pt
  confidence_threshold: 0.45

logging:
  enable: true
